[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobsearch"
version = "0.1.0"
description = "Automated job-search engine: fetch, filter, dedup, and rank job postings from ATS boards."
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "google-auth>=2.23",
    "google-api-python-client>=2.100",
    "google-auth-httplib2>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",
]

[project.scripts]
jobsearch = "jobsearch.cli:main"
jobsearch-send = "jobsearch.orchestrator:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
